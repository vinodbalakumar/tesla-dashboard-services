info.app.name=Tesla Dashboard Services
info.app.description=Tesla dashboard backend services
info.app.version=1.0.0
info.company.name=Tesla Dashboard Services

server.address=0.0.0.0
server.port=${SERVER_PORT:8081}
server.forward-headers-strategy=framework
spring.application.name=tesla-dashboard-services
server.servlet.context-path=/tesla-dashboard-services/api


# JPA Configuration


spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tesla}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0



# Print Hibernate SQL while debugging DB queries.
spring.jpa.show-sql=true

# Format SQL queries for better readability
spring.jpa.properties.hibernate.format_sql=true

# Include Hibernate SQL comments in generated queries
spring.jpa.properties.hibernate.use_sql_comments=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.java.vinod.tesla.dashboard.services=INFO
logging.level.org.springframework.security=INFO

app.jwt.public-key-base64=${JWT_PUBLIC_KEY_BASE64:}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:c:/Users/HP/projects/certs/jwt-public.pem}
app.jwt.audiences=${JWT_AUDIENCES:${JWT_AUDIENCE:auth-clients}}

tesla.fleet-api-base=${TESLA_FLEET_API_BASE:https://fleet-api.prd.na.vn.cloud.tesla.com}
tesla.proxy-base=${TESLA_PROXY_BASE:https://127.0.0.1:4443}
tesla.auth-token-url=${TESLA_AUTH_TOKEN_URL:https://auth.tesla.com/oauth2/v3/token}
tesla.vehicle-id-or-vin=${TESLA_VEHICLE_ID_OR_VIN:}
tesla.default-token-id=${TESLA_DEFAULT_TOKEN_ID:1}
tesla.token-refresh-skew-minutes=${TESLA_TOKEN_REFRESH_SKEW_MINUTES:2}

# Shared diagnostic delivery: metadata only; no AI calls on customer request threads.
app.diagnostics.enabled=${DIAGNOSTICS_ENABLED:false}
app.diagnostics.url=${DIAGNOSTICS_URL:http://localhost:8086/internal/diagnostics/events}
app.diagnostics.token=${DIAGNOSTICS_TOKEN:}
server.error.include-message=never
server.error.include-stacktrace=never

# Optional trace export; configure a private collector before enabling.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:0.1}
management.tracing.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

management.otlp.metrics.export.enabled=${OTEL_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.logging.export.otlp.enabled=${OTEL_EXPORT_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}

app.diagnostics.slow-ms=${DIAGNOSTICS_SLOW_MS:2000}
